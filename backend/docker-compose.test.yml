# Test runner overlay. Run from the project root (after `cp .env.example .env`):
#   docker compose -f docker-compose.yml -f backend/docker-compose.test.yml run --rm backend-test
# Uses an isolated database (<POSTGRES_DB>_test, recreated per run) and Redis logical DB 1.
# Token/webhook secrets here are throwaway test values, never the ones from .env.
services:
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: test-only-change-me-jwt-secret
      PAYMENT_WEBHOOK_SECRET: test-only-change-me-webhook-secret
      PAYMENT_WEBHOOK_URL: http://localhost:4999/api/v1/payments/webhook
      LOG_LEVEL: error
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # HTTP benchmark runner (autocannon) inside the compose network, against the running backend:
  #   docker compose -f docker-compose.yml -f backend/docker-compose.test.yml run --rm backend-bench
  backend-bench:
    profiles: ["bench"]
    build:
      context: ./backend
      target: test
    command: ["npm", "run", "bench"]
    environment:
      BENCH_BASE_URL: http://backend:4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
    depends_on:
      backend: { condition: service_healthy }
